name: Docs

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - run: uv sync --group docs

      # --strict fails the build on warnings (broken links, bad nav entries),
      # which is exactly what a PR check should catch before merge.
      - run: uv run mkdocs build --strict

      - if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/
          overwrite: true

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
